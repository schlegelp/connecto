[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "connecto"
version = "0.1.1"
description = "Unified interface for querying connectomes."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Philipp Schlegel" }]
keywords = ["connectomics", "neuroscience", "CAVE", "neuPrint", "FlyWire"]
dependencies = [
    # 8.0 switched to pandas-native query execution; earlier versions stream CSV
    # and mangle types, which silently corrupts int64 root IDs.
    "caveclient>=8.0",
    "neuprint-python>=0.5.1",
    "navis>=1.7.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "requests>=2.28",
    "trimesh>=4.0",
    "tqdm>=4.60",
    # Required by the CAVE backend for meshes and for the skeleton service
    # (caveclient reaches for it internally), so not really optional.
    "cloud-volume>=8.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
clio = ["clio-py"]
flytable = ["sea-serpent"]
# Masking a dense cutout down to one root means testing every voxel against a
# ~27,000-element supervoxel manifest. fastremap does that far faster than
# `np.isin`; `connecto.voxels.pcg` falls back to numpy without it, so this buys
# speed on the CAVE sparse-volume path and nothing else.
voxels = ["fastremap>=1.14"]
# ruff >=0.15: older versions still enable the deprecated UP038 via the `UP` prefix,
# which flags every isinstance(x, (int, np.integer)) in the codebase. Ruff deprecated
# that rule because the `X | Y` form it suggests is slower and not recommended.
dev = ["pytest>=8.0", "pytest-cov", "ruff>=0.15"]
# The API reference is generated from the docstrings, so mkdocstrings is not
# optional for a *complete* build - without it the reference pages come out empty.
docs = ["zensical>=0.0.50", "mkdocstrings[python]>=1.0.6"]

[tool.uv.sources]
clio-py = { git = "https://github.com/schlegelp/clio-py" }

[tool.hatch.build.targets.wheel]
packages = ["connecto"]

[tool.pytest.ini_options]
markers = [
    "network: requires network access and credentials (deselect with '-m \"not network\"')",
]
addopts = "-m 'not network'"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line length; the formatter's job
    "B905",  # zip(strict=) - our zips are over xyz/voxel-size triples, always equal length
    "UP042", # Cap(str, Enum) is deliberate: capabilities must round-trip as plain strings
]

