# Docs: https://zensical.org/docs/
#
#   uv run zensical serve -o     # live preview
#   uv run zensical build        # -> site/

[project]
site_name = "connecto"
site_description = "A unified interface for querying connectomes. One API over CAVE and neuPrint - FlyWire, hemibrain, BANC, MICrONS and more."
site_author = "Philipp Schlegel"
site_url = "https://schlegelp.github.io/connecto/"
repo_url = "https://github.com/schlegelp/connecto"
repo_name = "schlegelp/connecto"
edit_uri = "edit/main/docs/"

copyright = """
Copyright &copy; 2026 Philipp Schlegel &ndash;
<a href="https://github.com/schlegelp/connecto/blob/main/LICENSE">MIT</a>
"""

# Loaded on every page, not just the landing page. Instant navigation swaps the
# page container, and anything linked from a per-page template block can go with
# it; both files are scoped so they are inert everywhere except the homepage.
extra_css = ["stylesheets/extra.css", "stylesheets/home.css"]
extra_javascript = ["javascripts/orb.js"]

nav = [
  { "Home" = "index.md" },
  { "Get started" = [
    { "Get started" = "get-started/index.md" },
    { "Installation" = "get-started/installation.md" },
    { "Credentials" = "get-started/credentials.md" },
    { "Quickstart" = "get-started/quickstart.md" },
  ] },
  { "Tutorials" = [
    { "Tutorials" = "tutorials/index.md" },
    { "1. Your first query" = "tutorials/first-query.md" },
    { "2. Selecting neurons" = "tutorials/selecting-neurons.md" },
    { "3. Connectivity" = "tutorials/connectivity.md" },
    { "4. Morphology" = "tutorials/morphology.md" },
    { "5. Versions and root IDs" = "tutorials/versions.md" },
    { "6. One script, two datasets" = "tutorials/cross-dataset.md" },
  ] },
  { "Guides" = [
    { "Guides" = "guides/index.md" },
    { "Datasets" = "guides/datasets.md" },
    { "Capabilities" = "guides/capabilities.md" },
    { "Neuroglancer" = "guides/neuroglancer.md" },
    { "Adding a dataset" = "guides/custom-datasets.md" },
    { "Caching" = "guides/caching.md" },
    { "When the server is down" = "guides/outages.md" },
  ] },
  { "Reference" = [
    { "Reference" = "reference/index.md" },
    { "Dataset" = "reference/dataset.md" },
    { "Namespaces" = "reference/namespaces.md" },
    { "Selecting neurons" = "reference/criteria.md" },
    { "Registry and specs" = "reference/registry.md" },
    { "Auth and cache" = "reference/auth.md" },
  ] },
  { "Changelog" = "changelog.md" },
]

# ----------------------------------------------------------------------------

[project.theme]
logo = "assets/logo.svg"
favicon = "assets/logo.svg"
language = "en"

features = [
  "announce.dismiss",
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

# The landing page overrides the `hero` block to mount the crystal ball.
custom_dir = "overrides"

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep purple"
accent = "amber"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "deep purple"
accent = "amber"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/schlegelp/connecto"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/connecto/"

# ----------------------------------------------------------------------------
# API reference is generated from the docstrings - there is no second copy of
# the documentation to drift out of sync with the code.
# ----------------------------------------------------------------------------

[project.plugins.search]

[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
docstring_section_style = "table"
show_source = true
show_root_heading = true
show_root_full_path = false
show_symbol_type_heading = true
show_symbol_type_toc = true
show_signature_annotations = true
separate_signature = true
signature_crossrefs = true
merge_init_into_class = true
members_order = "source"
filters = ["!^_"]
heading_level = 2

# ----------------------------------------------------------------------------

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.tilde]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]

[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
